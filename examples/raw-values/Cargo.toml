[package]
name = "raw-values"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
deser = { package = "laputa-deser", path = "../../deser", features = ["derive"] }
deser-cbor = { package = "laputa-deser-cbor", path = "../../deser-cbor" }
deser-json = { package = "laputa-deser-json", path = "../../deser-json" }
deser-yaml = { package = "laputa-deser-yaml", path = "../../deser-yaml" }

[[bin]]
name = "raw-values"
path = "src/main.rs"
test = false
doc = false
