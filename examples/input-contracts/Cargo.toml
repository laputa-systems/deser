[package]
name = "input-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
deser = { package = "laputa-deser", path = "../../deser", features = ["derive"] }
deser-json = { package = "laputa-deser-json", path = "../../deser-json" }
