[package]
name = "deser-transcode"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.3"
edition.workspace = true
rust-version.workspace = true
description = "Converts values from one data format to another with deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "transcode", "conversion"]
categories = ["encoding", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-transcode"
autotests = false

[dependencies]
deser-core = { package = "laputa-deser-core", version = "0.10.3", path = "../deser-core", default-features = false }

[dev-dependencies]
deser = { package = "laputa-deser", version = "0.10.3", path = "../deser", features = ["derive"] }
deser-cbor = { package = "laputa-deser-cbor", path = "../deser-cbor" }
deser-csv = { package = "laputa-deser-csv", path = "../deser-csv" }
deser-json = { package = "laputa-deser-json", path = "../deser-json" }
deser-msgpack = { path = "../deser-msgpack" }
deser-path = { package = "laputa-deser-path", path = "../deser-path" }
deser-toml = { package = "laputa-deser-toml", path = "../deser-toml" }
deser-urlencoded = { path = "../deser-urlencoded" }
deser-value = { package = "laputa-deser-value", path = "../deser-value" }
deser-xml = { path = "../deser-xml" }
deser-yaml = { package = "laputa-deser-yaml", path = "../deser-yaml" }

[[test]]
name = "integration"
path = "tests/integration.rs"
