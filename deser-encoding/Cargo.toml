[package]
name = "laputa-deser-encoding"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.3"
edition.workspace = true
rust-version.workspace = true
description = "Hex and base32 encodings of bytes for deser"
repository = "https://github.com/laputa-systems/deser"
keywords = ["serialization", "deserialization", "hex", "base32"]
categories = ["encoding"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-encoding"

[lib]
name = "deser_encoding"

[dependencies]
deser-core = { package = "laputa-deser-core", version = "0.10.3", path = "../deser-core", default-features = false }
# an implementation detail, not part of the public API
data-encoding = "2.6"

[dev-dependencies]
deser = { package = "laputa-deser", version = "0.10.3", path = "../deser", features = ["derive"] }
deser-cbor = { package = "laputa-deser-cbor", path = "../deser-cbor" }
deser-json = { package = "laputa-deser-json", path = "../deser-json" }
