[package]
name = "deser-plist"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.3"
edition.workspace = true
rust-version.workspace = true
description = "Property list (plist) support for deser"
repository = "https://github.com/mitsuhiko/deser"
keywords = ["serialization", "deserialization", "plist", "apple"]
categories = ["encoding", "parser-implementations", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-plist"
# the vendored test data is only needed for development
exclude = ["tests/data"]
autotests = false

[features]
default = ["std", "io", "speedups"]
# the standard library, without it only `alloc` is needed
std = ["deser-core/std"]
# reading and writing values from and to streams (with `deser::io`)
io = ["std", "deser-core/io"]
# no speedups yet, the feature exists so that all formats have it
speedups = []

[dependencies]
deser-core = { package = "laputa-deser-core", version = "0.10.3", path = "../deser-core", default-features = false }
zmij = "1.0.23"

[dev-dependencies]
deser = { package = "laputa-deser", version = "0.10.3", path = "../deser", features = ["derive"] }
deser-location = { package = "laputa-deser-location", version = "0.10.3", path = "../deser-location" }

[[test]]
name = "integration"
path = "tests/integration.rs"
