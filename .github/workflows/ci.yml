name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-latest:
    name: Test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test
        run: make test

  check-no-std:
    name: Check (no_std)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    env:
      # unused imports and the like only show up in these builds
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf, aarch64-unknown-none
      - name: Check
        run: make check-no-std

  test-msrv:
    name: Test (MSRV)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.88"
      - name: Test
        run: make msrv

  miri-test-latest:
    name: Miri Test (${{ matrix.name }})
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    # miri is slow, the crates are split across jobs so they run in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deser
            crates: deser-core deser
          - name: deser, tree borrows
            tree-borrows-crates: deser-core deser:test_soundness
          - name: deser-json
            crates: deser-template-json deser-json
          - name: other crates
            crates: deser-msgpack deser-cbor deser-xml deser-csv deser-transcode deser-debug deser-path deser-location

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: miri
      - name: Miri Test
        run: make miri-test MIRI_CRATES="${{ matrix.crates }}" MIRI_TREE_BORROWS_CRATES="${{ matrix.tree-borrows-crates }}"
