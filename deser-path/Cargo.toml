[package]
name = "laputa-deser-path"
authors = ["Armin Ronacher <armin.ronacher@active-4.com>"]
version = "0.10.2"
edition.workspace = true
rust-version.workspace = true
description = "Tracks the path of values (like servers[1].port) for errors of deser"
repository = "https://github.com/laputa-systems/deser"
keywords = ["serialization", "deserialization", "path", "errors"]
categories = ["encoding", "no-std"]
readme = "README.md"
license = "Apache-2.0"
documentation = "https://docs.rs/deser-path"
autotests = false

[lib]
name = "deser_path"

[dependencies]
deser-core = { package = "laputa-deser-core", version = "0.10.2", path = "../deser-core", default-features = false }

[dev-dependencies]
deser = { package = "laputa-deser", version = "0.10.2", path = "../deser", features = ["derive"] }
deser-json = { package = "laputa-deser-json", path = "../deser-json" }

[[test]]
name = "integration"
path = "tests/integration.rs"
